version: '3.8'

services:
  # ─── API Backend (FastAPI) ───────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/documentos:/app/data/documentos
      - ./backend/users.json:/app/users.json
      - query_history:/app/data
      - embeddings_cache:/root/.cache
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - TOP_K=${TOP_K:-5}
      - TEMPERATURE=${TEMPERATURE:-0.3}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cambiar-en-produccion-clave-secreta}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-480}
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - rag-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── ChromaDB (Base de datos vectorial) ──────────────────────────────
  chroma:
    image: chromadb/chroma:0.5.23
    container_name: rag-chroma
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # ─── n8n (Orquestador de workflows) ─────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: rag-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data/documentos:/data/documentos
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123}
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=America/Bogota
    networks:
      - rag-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Nginx (Proxy reverso + Frontend) ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - rag-network

volumes:
  chroma_data:
    driver: local
  n8n_data:
    driver: local
  embeddings_cache:
    driver: local
  query_history:
    driver: local

networks:
  rag-network:
    driver: bridge
